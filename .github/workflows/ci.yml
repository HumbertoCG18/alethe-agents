name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

# Cancel older runs for the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Run the colocated frontend test suite.
      - name: Run unit tests
        run: npm test

      # Build includes TypeScript and translation key checks.
      - name: Typecheck and build
        run: npm run build

  rust:
    name: Rust check (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows
          - platform: ubuntu-22.04
            label: Linux
          - platform: macos-latest
            label: macOS
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libasound2-dev is ALSA: `cpal` (on-device voice dictation) links against it
          # through alsa-sys, and without it the Linux build panics in its build script.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      # Existing warnings keep clippy informational until a dedicated cleanup.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets
        continue-on-error: true

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
